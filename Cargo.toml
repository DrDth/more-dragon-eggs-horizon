[package]
name = "more_dragon_eggs"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
# Until a Nightly has the `dragon_fight_won` hook (horizon-rust/horizon#18539, merged), the mod
# builds inside a Horizon checkout, from `.local/dev-mods/more_dragon_eggs` (see README.md); then
# this becomes the pinned SDK path `cargo horizon-mod` writes.
horizon-mod-api = { path = "../../../crates/horizon-mod-api" }

# A mod is its own project, not a member of the game's workspace.
[workspace]
